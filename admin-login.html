<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HFC Admin Login</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="loginForm">
    <h2>Admin Login</h2>
    <input type="password" id="passwordInput" placeholder="Enter password" />
    <button onclick="checkPassword()">Log In</button>
  </div>

  <footer>
    <p>Version: 1.1.24</p>
  </footer>

  <script src="admin.js"></script>

  <script>
    // Check if the user is already logged in
    if (localStorage.getItem('isLoggedIn') === 'true') {
      // If the user is logged in, redirect to admin-console.html
      window.location.href = 'admin-console.html';
    }
  </script>
</body>
</html>
