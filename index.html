<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HFC Video Kiosk v1.1.21</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
  <!-- HEADER -->
  <header>
    <div id="header-left">
      <img src="https://www.wheelinghealthfitness.center/wp-content/themes/wpd-hfc-auto/assets/media/logo.svg" alt="HFC Logo" class="logo">
    </div>
    <div id="header-center">
      <h2>Select a Playlist</h2>
      <div id="playlistScrollContainer">
        <button id="scrollLeft">&lt;</button>
        <div class="playlist-buttons" id="playlistButtons"></div>
        <button id="scrollRight">&gt;</button>
      </div>
    </div>
    <div id="header-right">
      <button id="decreaseText">A‑</button>
      <button id="increaseText">A+</button>
      <button id="reloadPage">⟳ Reload</button>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <div class="video-player">
      <div id="videoFrame"></div>
      <img id="videoPlaceholder" src="" alt="Video Thumbnail">
    </div>
    <div class="playlist-container">
      <div class="video-list">
        <div id="loadingIndicator">Loading...</div>
        <ul id="playlistItems"></ul>
      </div>
      <div class="playback-controls">
        <button id="rewindBtn">
          <svg viewBox="0 0 60 60"><polygon points="40,10 20,30 40,50"/><polygon points="30,10 10,30 30,50"/></svg>
          <span>Rewind</span>
        </button>
        <button id="playPauseBtn">
          <svg id="playIcon" viewBox="0 0 60 60"><polygon points="20,10 50,30 20,50"/></svg>
          <svg id="pauseIcon" viewBox="0 0 60 60" style="display:none;"><rect x="15" y="10" width="8" height="40"/><rect x="37" y="10" width="8" height="40"/></svg>
          <span id="playPauseText">Play</span>
        </button>
        <button id="skipBtn">
          <svg viewBox="0 0 60 60"><polygon points="20,10 40,30 20,50"/><polygon points="30,10 50,30 30,50"/></svg>
          <span>Skip</span>
        </button>
      </div>
    </div>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
