<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HFC Kiosk Admin CMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: #f5f5f5;
      color: #333;
      max-width: 900px;
      margin: 0 auto;
      padding: 30px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
    }
    .logo-title {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    header img {
      height: 80px;
    }
    header h1 {
      color: #0099A8;
      margin: 0;
    }
    .playlist-entry {
      background: #fff;
      border: 2px solid #606261;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .playlist-entry label {
      font-weight: bold;
    }
    .playlist-entry input[type="text"] {
      width: 100%;
      padding: 8px;
      margin: 6px 0 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .controls label {
      font-weight: normal;
    }
    .controls .delete-btn {
      background-color: #c10230;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    button {
      padding: 10px 20px;
      margin: 10px 10px 0 0;
      font-size: 1em;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #addBtn { background-color: #0099A8; color: white; }
    #saveBtn { background-color: #DB8F27; color: white; }
    #logoutBtn { background-color: #606261; color: white; float: right; }
    #downloadBtn { background-color: #789904; color: white; }
    #loginOverlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    #loginOverlay input {
      padding: 10px;
      margin: 10px;
      width: 300px;
      font-size: 1em;
    }
  </style>
</head>
<body>
  <div id="loginOverlay">
    <h2>Enter GitHub Token</h2>
    <input type="password" id="tokenInput" placeholder="Paste your GitHub token">
    <button onclick="submitToken()">Login</button>
  </div>

  <header>
    <div class="logo-title">
      <img src="https://www.wheelinghealthfitness.center/wp-content/themes/wpd-hfc-auto/assets/media/logo.svg" alt="HFC Logo" />
      <h1>HFC Kiosk Admin</h1>
    </div>
    <button id="logoutBtn" onclick="logout()">Log Out</button>
  </header>

  <div id="playlistContainer"></div>
  <button id="addBtn" onclick="addEntry()">+ Add Playlist</button>
  <button id="saveBtn" onclick="commitToGitHub()">Save to GitHub</button>
  <button id="downloadBtn" onclick="downloadJSON()">Download JSON</button>

  <script>
    let playlists = [];
    let token = '';

    async function fetchPlaylists() {
      const res = await fetch('playlists.json');
      playlists = await res.json();
      renderForm();
    }

    function renderForm() {
      const container = document.getElementById('playlistContainer');
      container.innerHTML = '';
      playlists.forEach((pl, index) => {
        const div = document.createElement('div');
        div.className = 'playlist-entry';
        div.innerHTML = `
          <label>Title</label>
          <input type="text" value="${pl.title}" onchange="updateField(${index}, 'title', this.value)">
          <label>Playlist ID</label>
          <input type="text" value="${pl.id}" onchange="updateField(${index}, 'id', this.value)">
          <div class="controls">
            <label><input type="checkbox" name="default" ${pl.default ? 'checked' : ''} onchange="setDefault(${index}, this.checked)"> Default</label>
            <label><input type="checkbox" ${pl.visible !== false ? 'checked' : ''} onchange="updateField(${index}, 'visible', this.checked)"> Visible</label>
            <button class="delete-btn" onclick="deleteEntry(${index})">Delete</button>
          </div>`;
        container.appendChild(div);
      });
    }

    function updateField(index, field, value) {
      playlists[index][field] = value;
    }

    function setDefault(index, isDefault) {
      if (isDefault) {
        playlists.forEach((p, i) => p.default = (i === index));
        renderForm();
      }
    }

    function addEntry() {
      playlists.push({ title: '', id: '', default: false, visible: true });
      renderForm();
    }

    function deleteEntry(index) {
      if (confirm('Delete this playlist?')) {
        playlists.splice(index, 1);
        renderForm();
      }
    }

    function logout() {
      token = '';
      document.getElementById('loginOverlay').style.display = 'flex';
    }

    function submitToken() {
      token = document.getElementById('tokenInput').value.trim();
      if (token.length > 30) {
        document.getElementById('loginOverlay').style.display = 'none';
        fetchPlaylists();
      } else {
        alert('Invalid token');
      }
    }

    function downloadJSON() {
      const blob = new Blob([JSON.stringify(playlists, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'playlists.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    async function commitToGitHub() {
      const filePath = 'playlists.json';
      const apiUrl = 'https://api.github.com/repos/wpddputziger/hfc-kiosk/contents/' + filePath;

      const getRes = await fetch(apiUrl, {
        headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' }
      });
      const data = await getRes.json();
      const sha = data.sha;

      const content = btoa(unescape(encodeURIComponent(JSON.stringify(playlists, null, 2))));

      const commitRes = await fetch(apiUrl, {
        method: 'PUT',
        headers: {
          Authorization: `Bearer ${token}`,
          Accept: 'application/vnd.github+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: 'Update playlists.json from admin panel',
          content: content,
          sha: sha
        })
      });

      if (commitRes.ok) {
        alert('Successfully committed to GitHub!');
      } else {
        alert('Failed to commit changes. Check token and permissions.');
      }
    }
  </script>
</body>
</html>
