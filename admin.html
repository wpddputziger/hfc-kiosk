<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HFC Kiosk Admin CMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: #f5f5f5;
      color: #333;
      max-width: 900px;
      margin: 0 auto;
      padding: 30px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 20px;
      background-color: #606261;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 30px;
    }
    header img {
      height: 60px;
    }
    header h1 {
      color: #fff;
      margin: 0;
      font-size: 1.5em;
    }
    .playlist-entry {
      background: #fff;
      border: 2px solid #606261;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .playlist-entry label {
      font-weight: bold;
      display: block;
    }
    .playlist-entry input[type="text"] {
      width: 100%;
      max-width: 500px;
      padding: 6px;
      margin: 6px 0 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .playlist-entry input[name="title"] {
      max-length: 50;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
    }
    .controls label {
      font-weight: normal;
    }
    .controls .delete-btn {
      background-color: #c10230;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    button {
      padding: 10px 20px;
      margin: 10px 10px 0 0;
      font-size: 1em;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #addBtn { background-color: #0099A8; color: white; }
    #saveBtn { background-color: #DB8F27; color: white; }
    #logoutBtn { background-color: #606261; color: white; margin-left: auto; }
    #downloadBtn { background-color: #789904; color: white; }
  </style>
</head>
<body>
  <header>
    <img src="https://www.wheelinghealthfitness.center/wp-content/themes/wpd-hfc-auto/assets/media/logo.svg" alt="HFC Logo" />
    <h1>HFC Kiosk Admin</h1>
    <button id="logoutBtn" onclick="logout()">Log Out</button>
  </header>

  <div id="playlistContainer"></div>
  <button id="addBtn" onclick="addEntry()">+ Add Playlist</button>
  <button id="saveBtn" onclick="commitToGitHub()">Save to GitHub</button>
  <button id="downloadBtn" onclick="downloadJSON()">Download JSON</button>

  <script src="admin.js"></script>

</body>
</html>
