<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HFC Kiosk Admin CMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: #f5f5f5;
      color: #333;
      max-width: 900px;
      margin: 0 auto;
      padding: 30px;
    }

    /* Center password prompt */
    #passwordPrompt {
      display: block;
      text-align: center;
      padding: 20px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      margin-top: 50px;
    }

    #adminPage {
      display: none;  /* Initially hidden */
    }

    button {
      padding: 10px 20px;
      margin: 10px 10px 0 0;
      font-size: 1em;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #passwordPrompt input[type="password"] {
      padding: 10px;
      font-size: 1em;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    #passwordPrompt button {
      background-color: #0099A8;
      color: white;
    }

    footer {
      margin-top: 50px;
      text-align: center;
    }

  </style>
</head>
<body>

  <!-- Password prompt section (centered with input field) -->
  <div id="passwordPrompt">
    <p>Please enter the admin password:</p>
    <input type="password" id="passwordInput" placeholder="Enter password" />
    <button onclick="checkPassword()">Enter Password</button>
    <footer>
      <p>Version: 1.1.23</p>  <!-- Version info on login screen -->
    </footer>
  </div>

  <!-- Admin interface (will be shown after password is correct) -->
  <div id="adminPage">
    <header>
      <img src="https://www.wheelinghealthfitness.center/wp-content/themes/wpd-hfc-auto/assets/media/logo.svg" alt="HFC Logo" />
      <h1>HFC Kiosk Admin</h1>
      <button id="logoutBtn" onclick="logout()">Log Out</button>
    </header>

    <div id="playlistContainer"></div>
    <button id="addBtn" onclick="addEntry()">+ Add Playlist</button>
    <button id="saveBtn" onclick="commitToGitHub()">Save to GitHub</button>
    <button id="downloadBtn" onclick="downloadJSON()">Download JSON</button>

    <footer>
      <p>Version: 1.1.23</p>
    </footer>
  </div>

  <script src="admin.js"></script>
  <script>
    // Function to check the password
    function checkPassword() {
      const password = document.getElementById('passwordInput').value;
      const adminPassword = 'yourpassword';  // Change to your desired password

      if (password === adminPassword) {
        // Show the admin page and hide the password prompt
        document.getElementById('adminPage').style.display = 'block';
        document.getElementById('passwordPrompt').style.display = 'none';

        // Optionally, fetch playlists or initialize other admin features
        fetchPlaylists();
      } else {
        alert('Incorrect password!');
      }
    }

    // Allow user to hit "Enter" key to submit password
    document.getElementById('passwordInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        checkPassword();  // Trigger password check on Enter key press
      }
    });
  </script>
</body>
</html>
