<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HFC Kiosk Admin CMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: #f5f5f5;
      color: #333;
      max-width: 900px;
      margin: 0 auto;
      padding: 30px;
    }
    #adminPage {
      display: none;  /* Initially hidden */
    }
    #passwordPrompt {
      display: block; /* Initially visible */
    }
    button {
      padding: 10px 20px;
      margin: 10px 10px 0 0;
      font-size: 1em;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #passwordPrompt button {
      background-color: #0099A8;
      color: white;
    }
  </style>
</head>
<body>

  <!-- Password prompt section -->
  <div id="passwordPrompt">
    <p>Please enter the admin password:</p>
    <button onclick="checkPassword()">Enter Password</button>
  </div>

  <!-- Admin interface (will be shown after password is correct) -->
  <div id="adminPage">
    <header>
      <img src="https://www.wheelinghealthfitness.center/wp-content/themes/wpd-hfc-auto/assets/media/logo.svg" alt="HFC Logo" />
      <h1>HFC Kiosk Admin</h1>
      <button id="logoutBtn" onclick="logout()">Log Out</button>
    </header>

    <div id="playlistContainer"></div>
    <button id="addBtn" onclick="addEntry()">+ Add Playlist</button>
    <button id="saveBtn" onclick="commitToGitHub()">Save to GitHub</button>
    <button id="downloadBtn" onclick="downloadJSON()">Download JSON</button>

    <footer style="margin-top: 50px; text-align: center;">
      <p>Version: 1.1.23</p> <!-- Incremented version number -->
    </footer>
  </div>

  <script src="admin.js"></script>
</body>
</html>
