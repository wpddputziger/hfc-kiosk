<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Playlist Editor – HFC Kiosk</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #f9f9f9;
      color: #333;
    }
    h1 {
      color: #0099A8;
    }
    .playlist-entry {
      margin-bottom: 15px;
      padding: 10px;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 4px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: bold;
    }
    input[type="text"] {
      width: 100%;
      padding: 6px;
      margin-bottom: 8px;
    }
    button {
      padding: 6px 12px;
      margin-top: 10px;
      cursor: pointer;
    }
    #downloadBtn {
      margin-top: 20px;
      background-color: #0099A8;
      color: #fff;
      border: none;
    }
    .delete-btn {
      background: #c10230;
      color: #fff;
      border: none;
      float: right;
    }
  </style>
</head>
<body>
  <h1>HFC Playlist Editor</h1>
  <div id="playlistContainer"></div>
  <button onclick="addEntry()">+ Add Playlist</button>
  <button id="downloadBtn" onclick="downloadJSON()">Download JSON</button>

  <script>
    let playlists = [];

    fetch('playlists.json')
      .then(res => res.json())
      .then(data => {
        playlists = data;
        renderForm();
      })
      .catch(err => {
        document.getElementById('playlistContainer').innerHTML = '<p style="color:red;">Failed to load playlists.json</p>';
      });

    function renderForm() {
      const container = document.getElementById('playlistContainer');
      container.innerHTML = '';
      playlists.forEach((pl, index) => {
        const div = document.createElement('div');
        div.className = 'playlist-entry';
        div.innerHTML = `
          <label>Title</label>
          <input type="text" value="${pl.title}" onchange="updateField(${index}, 'title', this.value)">
          <label>Playlist ID</label>
          <input type="text" value="${pl.id}" onchange="updateField(${index}, 'id', this.value)">
          <button class="delete-btn" onclick="deleteEntry(${index})">Delete</button>
        `;
        container.appendChild(div);
      });
    }

    function updateField(index, field, value) {
      playlists[index][field] = value;
    }

    function addEntry() {
      playlists.push({ title: '', id: '' });
      renderForm();
    }

    function deleteEntry(index) {
      if (confirm('Delete this playlist?')) {
        playlists.splice(index, 1);
        renderForm();
      }
    }

    function downloadJSON() {
      const blob = new Blob([JSON.stringify(playlists, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'playlists.json';
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
