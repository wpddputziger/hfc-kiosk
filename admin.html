<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HFC Kiosk Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: #f5f5f5;
      color: #333;
      max-width: 900px;
      margin: 0 auto;
      padding: 30px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 30px;
    }
    .logo-title {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    header img {
      height: 80px;
    }
    header h1 {
      color: #0099A8;
      margin: 0;
    }
    .playlist-entry {
      background: #fff;
      border: 2px solid #606261;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      position: relative;
    }
    .playlist-entry label {
      display: block;
      margin-bottom: 4px;
      font-weight: bold;
    }
    .playlist-entry input[type="text"] {
      width: calc(100% - 20px);
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .playlist-entry .checkboxes {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 10px;
    }
    .playlist-entry .delete-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background-color: #c10230;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    button {
      padding: 10px 20px;
      margin-top: 15px;
      margin-right: 10px;
      font-size: 1em;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #addBtn {
      background-color: #0099A8;
      color: white;
    }
    #downloadBtn {
      background-color: #789904;
      color: white;
    }
    #saveBtn {
      background-color: #DB8F27;
      color: white;
    }
    #logoutBtn {
      background-color: #606261;
      color: white;
      margin-left: auto;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-title">
      <img src="https://www.wheelinghealthfitness.center/wp-content/themes/wpd-hfc-auto/assets/media/logo.svg" alt="HFC Logo" />
      <h1>HFC Kiosk Admin</h1>
    </div>
    <button id="logoutBtn" onclick="logout()">Log Out</button>
  </header>

  <div id="playlistContainer"></div>

  <button id="addBtn" onclick="addEntry()">+ Add Playlist</button>
  <button id="saveBtn" onclick="saveChanges()">Save / Commit Changes</button>
  <button id="downloadBtn" onclick="downloadJSON()">Download JSON</button>

  <script>
    let playlists = [];

    fetch('playlists.json')
      .then(res => res.json())
      .then(data => {
        playlists = data;
        renderForm();
      })
      .catch(err => {
        document.getElementById('playlistContainer').innerHTML = '<p style="color:red;">Failed to load playlists.json</p>';
      });

    function renderForm() {
      const container = document.getElementById('playlistContainer');
      container.innerHTML = '';
      playlists.forEach((pl, index) => {
        const div = document.createElement('div');
        div.className = 'playlist-entry';
        div.innerHTML = `
          <label>Title</label>
          <input type="text" value="${pl.title}" onchange="updateField(${index}, 'title', this.value)">
          <label>Playlist ID</label>
          <input type="text" value="${pl.id}" onchange="updateField(${index}, 'id', this.value)">
          <div class="checkboxes">
            <label><input type="checkbox" name="default" ${pl.default ? 'checked' : ''} onchange="setDefault(${index}, this.checked)"> Default</label>
            <label><input type="checkbox" ${pl.visible !== false ? 'checked' : ''} onchange="updateField(${index}, 'visible', this.checked)"> Visible</label>
          </div>
          <button class="delete-btn" onclick="deleteEntry(${index})">Delete</button>
        `;
        container.appendChild(div);
      });
    }

    function updateField(index, field, value) {
      playlists[index][field] = value;
    }

    function setDefault(index, isDefault) {
      if (isDefault) {
        playlists.forEach((p, i) => p.default = (i === index));
        renderForm(); // re-render to update checkboxes
      }
    }

    function addEntry() {
      playlists.push({ title: '', id: '', default: false, visible: true });
      renderForm();
    }

    function deleteEntry(index) {
      if (confirm('Delete this playlist?')) {
        playlists.splice(index, 1);
        renderForm();
      }
    }

    function saveChanges() {
      alert("Changes applied in memory. Use 'Download JSON' and commit via GitHub to go live.");
    }

    function downloadJSON() {
      const blob = new Blob([JSON.stringify(playlists, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'playlists.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function logout() {
      // Future: Clear session
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
