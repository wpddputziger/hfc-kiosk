<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HFC Kiosk Admin CMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: #f5f5f5;
      color: #333;
      max-width: 900px;
      margin: 0 auto;
      padding: 30px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 20px;
      background-color: #606261;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 30px;
    }
    header img {
      height: 60px;
    }
    header h1 {
      color: #fff;
      margin: 0;
      font-size: 1.5em;
    }
    .playlist-entry {
      background: #fff;
      border: 2px solid #606261;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .playlist-entry label {
      font-weight: bold;
      display: block;
    }
    .playlist-entry input[type="text"] {
      width: 100%;
      max-width: 500px;
      padding: 6px;
      margin: 6px 0 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .playlist-entry input[name="title"] {
      max-length: 50;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
    }
    .controls label {
      font-weight: normal;
    }
    .controls .delete-btn {
      background-color: #c10230;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    button {
      padding: 10px 20px;
      margin: 10px 10px 0 0;
      font-size: 1em;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #addBtn { background-color: #0099A8; color: white; }
    #saveBtn { background-color: #DB8F27; color: white; }
    #logoutBtn { background-color: #606261; color: white; margin-left: auto; }
    #downloadBtn { background-color: #789904; color: white; }
  </style>
</head>
<body>
  <header>
    <img src="https://www.wheelinghealthfitness.center/wp-content/themes/wpd-hfc-auto/assets/media/logo.svg" alt="HFC Logo" />
    <h1>HFC Kiosk Admin</h1>
    <button id="logoutBtn" onclick="logout()">Log Out</button>
  </header>

  <div id="playlistContainer"></div>
  <button id="addBtn" onclick="addEntry()">+ Add Playlist</button>
  <button id="saveBtn" onclick="commitToGitHub()">Save to GitHub</button>
  <button id="downloadBtn" onclick="downloadJSON()">Download JSON</button>

  <script>
    const token = 'YOUR_HARDCODED_TOKEN_HERE';
    const filePath = 'playlists.json';
    const repo = 'wpddputziger/hfc-kiosk';
    let playlists = [];

    async function fetchPlaylists() {
      const res = await fetch(filePath);
      playlists = await res.json();
      renderForm();
    }

    function renderForm() {
      const container = document.getElementById('playlistContainer');
      container.innerHTML = '';
      playlists.forEach((pl, index) => {
        const div = document.createElement('div');
        div.className = 'playlist-entry';
        div.innerHTML = `
          <label>Title</label>
          <input type="text" name="title" maxlength="50" value="${pl.title}" onchange="updateField(${index}, 'title', this.value)">
          <label>Playlist ID</label>
          <input type="text" value="${pl.id}" onchange="updateField(${index}, 'id', this.value)">
          <div class="controls">
            <label><input type="checkbox" name="default" ${pl.default ? 'checked' : ''} onchange="setDefault(${index}, this.checked)"> Default</label>
            <label><input type="checkbox" ${pl.visible !== false ? 'checked' : ''} onchange="updateField(${index}, 'visible', this.checked)"> Visible</label>
            <button class="delete-btn" onclick="deleteEntry(${index})">Delete</button>
          </div>`;
        container.appendChild(div);
      });
    }

    function updateField(index, field, value) {
      playlists[index][field] = value;
    }

    function setDefault(index, isDefault) {
      if (isDefault) {
        playlists.forEach((p, i) => p.default = (i === index));
        renderForm();
      }
    }

    function addEntry() {
      if (playlists.length >= 12) return alert('Maximum of 12 playlists allowed.');
      const url = prompt('Enter YouTube Playlist URL:');
      const match = url.match(/[?&]list=([a-zA-Z0-9_-]+)/);
      if (!match) return alert('Invalid playlist URL.');
      const playlistId = match[1];
      fetch(`https://www.googleapis.com/youtube/v3/playlists?part=snippet&id=${playlistId}&key=AIzaSyBXOnPb8MKxBE1pT6SYvdQdX_87350Nk9g`)
        .then(res => res.json())
        .then(data => {
          if (!data.items || !data.items.length) return alert('Playlist not found or not public.');
          const title = data.items[0].snippet.title;
          playlists.push({ title, id: playlistId, default: false, visible: true });
          renderForm();
        });
    }

    function deleteEntry(index) {
      if (confirm('Delete this playlist?')) {
        playlists.splice(index, 1);
        renderForm();
      }
    }

    function downloadJSON() {
      const blob = new Blob([JSON.stringify(playlists, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'playlists.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    async function commitToGitHub() {
      const apiUrl = `https://api.github.com/repos/${repo}/contents/${filePath}`;

      const getRes = await fetch(apiUrl, {
        headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' }
      });
      const data = await getRes.json();
      const sha = data.sha;

      const content = btoa(unescape(encodeURIComponent(JSON.stringify(playlists, null, 2))));

      const commitRes = await fetch(apiUrl, {
        method: 'PUT',
        headers: {
          Authorization: `Bearer ${token}`,
          Accept: 'application/vnd.github+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: 'Update playlists.json from admin panel',
          content: content,
          sha: sha
        })
      });

      if (commitRes.ok) {
        alert('Successfully committed to GitHub!');
      } else {
        alert('Failed to commit changes. Check token and permissions.');
      }
    }

    fetchPlaylists();
  </script>
</body>
</html>
