<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HFC Kiosk Admin CMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: #f5f5f5;
      color: #333;
      max-width: 900px;
      margin: 0 auto;
      padding: 30px;
    }

    #passwordPrompt {
      display: none;
      text-align: center;
      padding: 20px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      margin-top: 50px;
    }

    #adminPage {
      display: none;
    }

    header {
      display: flex;
      align-items: center;
      gap: 20px;
      background-color: #606261;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 30px;
      text-align: center;
    }

    header img {
      height: 50px;
    }

    header h1 {
      color: #fff;
      margin: 0;
      font-size: 1.5em;
    }

    button {
      padding: 10px 20px;
      margin: 10px 10px 0 0;
      font-size: 1em;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    footer {
      margin-top: 50px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="passwordPrompt">
    <p>Please enter the admin password:</p>
    <input type="password" id="passwordInput" placeholder="Enter password" />
    <button onclick="checkPassword()">Enter Password</button>
  </div>

  <div id="adminPage">
    <header>
      <img src="https://www.wheelinghealthfitness.center/wp-content/themes/wpd-hfc-auto/assets/media/logo.svg" alt="HFC Logo" />
      <h1>HFC Kiosk Admin</h1>
      <button id="logoutBtn" onclick="logout()">Log Out</button>
    </header>

    <div id="playlistContainer"></div>
    <button id="addBtn" onclick="addEntry()">+ Add Playlist</button>
    <button id="saveBtn" onclick="commitToGitHub()">Save to GitHub</button>
    <button id="downloadBtn" onclick="downloadJSON()">Download JSON</button>

    <footer>
      <p>Version: 1.1.24</p>
    </footer>
  </div>

  <script src="admin.js"></script>
  <script>
    // Protect the admin page
    if (!localStorage.getItem('isLoggedIn')) {
      window.location.href = 'admin-login.html'; // Redirect to login if not logged in
    }

    // Function to handle logout
    function logout() {
      localStorage.removeItem('isLoggedIn');  // Clear login status
      document.getElementById('adminPage').style.display = 'none';
      document.getElementById('passwordPrompt').style.display = 'block';
    }

    // Show the admin page if logged in
    document.getElementById('adminPage').style.display = 'block';
  </script>

</body>
</html>
